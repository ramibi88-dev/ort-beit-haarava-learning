<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אורט בית הערבה | מרכז הלמידה</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<header><div><div class="brandline"><span class="ort">ORT</span><span>אורט בית הערבה</span></div><h1 id="pageTitle">🎓 מרכז הלמידה הבית־ספרי</h1><div class="subtitle" id="pageSub">בחרו מקצוע והתחילו ללמוד, לתרגל ולהתקדם</div></div></header>
<section id="home"><div class="home-grid" id="subjectGrid"></div><div class="notice">💡 כרגע פעילים מבחני אנגלית וחינוך פיננסי. יתר המקצועות יסומנו כ"בקרוב".</div></section>
<section id="menu" class="panel hidden"><button type="button" class="back" id="backHome">→ חזרה לכל המקצועות</button><h2 class="topic-title" id="menuTitle"></h2><p id="menuDesc"></p><div class="choice-grid" id="choiceGrid"></div></section>
<section id="test" class="panel hidden"><div class="test-head"><div><strong id="testTitle"></strong><div id="counter"></div></div><div id="timer" class="timer">⏳ 15:00</div></div><div class="bar"><div id="fill" class="fill"></div></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="msg" class="msg" aria-live="polite"></div><div class="actions"><button type="button" id="stop" class="action stop">סיום מבחן עכשיו</button><button type="button" id="next" class="action next">לשאלה הבאה ←</button></div></section>
<section id="result" class="panel result hidden"><h2>🏁 המבחן הסתיים</h2><div>הציון שלך</div><div id="score" class="score"></div><div id="summary" class="summary"></div><div class="student-box"><label>שם התלמיד/ה<input id="studentName" type="text" placeholder="הקלידו שם לשמירה מקומית"></label><button type="button" id="saveResult" class="action next">שמור תוצאה במכשיר</button></div><div id="saveStatus" class="save-note" aria-live="polite"></div><button type="button" id="again" class="back">חזרה לבחירת מבחן</button></section>
</main><script src="app.js"></script></body></html>
